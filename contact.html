    <meta charset="utf-8">

</head>

<body>
	<div id="outer-wrapper">

		<header id="top">
			<h1>Spot the Bot!</h1>
		</header>

		<nav>
			<ul>
				<li><a href="index.html">Play</a></li>
                <div class="dropdown">
				<li><button class="dropbtn">Resources &#9660;</button></li>
				<div class="dropdown-content">
					<a href="resources1.html">Link 1</a>
					<a href="resources2.html">Link 2</a>
					<a href="resources3.html">Link 3</a>
				</div><!--end dropdown-content-->
				</div><!--end dropdown-->
				<div class="dropdown">
				<li><button class="dropbtn">About &#9660;</button></li>
				<div class="dropdown-content">
					<a href="about.html">About the Project</a>
					<a href="team.html">Meet the Team</a>
				</div><!--end dropdown-content-->
				</div><!--end dropdown-->
				<li><a style="background-color:#abb7cf;color:#3e4d73;border-style:solid;border-width:medium;border-color:#3e4d73;" href="contact.html">Contact</a></li>
            </ul>
		</nav>

		<div id="content">
			<h2>Contact Us</h2>
				<div id="content-p">
				<p><form>
					<label for="name"><b>Name:</b></label><br>
					<input type="text" id="name" name="name"><br><br>
					<label for="email"><b>Email:</b></label><br>
					<input type="email" id="email" name="email"><br><br>
					<label for="reason"><b>Reason:</b></label>
					<div class="custom-select" style="width:200px;">
					<select id="reason" name="reason">
						<option value="">Select One</option>
						<option value="General">General</option>
						<option value="Question">Question</option>
						<option value="Suggestion">Suggestion</option>
					</select>
					</div>
					<br>
					<label for="subject"><b>Subject:</b></label><br>
					<input type="text" id="subject" name="subject" maxlength="99"><br>
					<label for="message"><b>Message:</b></label><br>
					<textarea id="message" name="message" rows="15" cols="50"></textarea><br><br>
					<input type="submit" value="Submit">
				</form></p>
				</div> <!--end content-p-->
		</div> <!--end content-->

		<footer>
			<p>This is footer text</p>  
			<br>
		</footer>

	</div> <!--end outer-wrapper-->
<script>
var x, i, j, l, ll, selElmnt, a, b, c;
/*look for any elements with the class "custom-select":*/
x = document.getElementsByClassName("custom-select");
l = x.length;
for (i = 0; i < l; i++) {
  selElmnt = x[i].getElementsByTagName("select")[0];
  ll = selElmnt.length;
  /*for each element, create a new DIV that will act as the selected item:*/
  a = document.createElement("DIV");
  a.setAttribute("class", "select-selected");
  a.innerHTML = selElmnt.options[selElmnt.selectedIndex].innerHTML;
  x[i].appendChild(a);
  /*for each element, create a new DIV that will contain the option list:*/
  b = document.createElement("DIV");
  b.setAttribute("class", "select-items select-hide");
  for (j = 1; j < ll; j++) {
    /*for each option in the original select element,
    create a new DIV that will act as an option item:*/
    c = document.createElement("DIV");
    c.innerHTML = selElmnt.options[j].innerHTML;
    c.addEventListener("click", function(e) {
        /*when an item is clicked, update the original select box,
        and the selected item:*/
        var y, i, k, s, h, sl, yl;
        s = this.parentNode.parentNode.getElementsByTagName("select")[0];
        sl = s.length;
        h = this.parentNode.previousSibling;
        for (i = 0; i < sl; i++) {
          if (s.options[i].innerHTML == this.innerHTML) {
            s.selectedIndex = i;
            h.innerHTML = this.innerHTML;
            y = this.parentNode.getElementsByClassName("same-as-selected");
            yl = y.length;
            for (k = 0; k < yl; k++) {
              y[k].removeAttribute("class");
            }
            this.setAttribute("class", "same-as-selected");
            break;
          }
        }
        h.click();
    });
    b.appendChild(c);
  }
  x[i].appendChild(b);
  a.addEventListener("click", function(e) {
      /*when the select box is clicked, close any other select boxes,
      and open/close the current select box:*/
      e.stopPropagation();
      closeAllSelect(this);
      this.nextSibling.classList.toggle("select-hide");
      this.classList.toggle("select-arrow-active");
    });
}
function closeAllSelect(elmnt) {
  /*a function that will close all select boxes in the document,
  except the current select box:*/
  var x, y, i, xl, yl, arrNo = [];
  x = document.getElementsByClassName("select-items");
  y = document.getElementsByClassName("select-selected");
  xl = x.length;
  yl = y.length;
  for (i = 0; i < yl; i++) {
    if (elmnt == y[i]) {
      arrNo.push(i)
    } else {
      y[i].classList.remove("select-arrow-active");
    }
  }
  for (i = 0; i < xl; i++) {
    if (arrNo.indexOf(i)) {
      x[i].classList.add("select-hide");
    }
  }
}
/*if the user clicks anywhere outside the select box,
then close all select boxes:*/
document.addEventListener("click", closeAllSelect);
</script>
</body>
  
</html>
